name: Build Android APK

on:
  push:
    branches:
      - main
      - 'build-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: |
          if [ -f "icons_launcher.yaml" ] && [ -f "assets/icon.png" ]; then
            echo "Generating app icons from assets/icon.png..."
            dart run icons_launcher:create || true
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Get Build Info
        id: info
        run: |
          BUILD_TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            BUILD_TAG="build-${GITHUB_RUN_ID}"
          fi
          echo "tag=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "tag: ${BUILD_TAG}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/build-') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: release-${{ steps.info.outputs.tag }}-${{ github.run_number }}
          name: Release ${{ steps.info.outputs.tag }} (Build #${{ github.run_number }})
          body: |
            Automated Android build generated by SWAB Cloud Builder.
            - Commit: ${{ github.sha }}
            - Workflow Run: ${{ github.run_id }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
