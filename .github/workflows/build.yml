name: Build App

on:
  push:
    branches:
      - main
      - 'build-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: "!contains(github.ref_name, 'windows')"
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: |
          if [ -f "icons_launcher.yaml" ] && [ -f "assets/icon.png" ]; then
            echo "Generating app icons from assets/icon.png..."
            dart run icons_launcher:create || true
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Get Build Info
        id: info
        run: |
          BUILD_TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            BUILD_TAG="build-${GITHUB_RUN_ID}"
          fi
          echo "tag=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "tag: ${BUILD_TAG}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/build-') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: release-${{ steps.info.outputs.tag }}-${{ github.run_number }}
          name: Release ${{ steps.info.outputs.tag }} (Build #${{ github.run_number }})
          body: |
            Automated Android build generated by SWAB Cloud Builder.
            - Commit: ${{ github.sha }}
            - Workflow Run: ${{ github.run_id }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Application
    runs-on: windows-2022
    if: "contains(github.ref_name, 'windows') || github.ref_name == 'main'"
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up NuGet
        uses: nuget/setup-nuget@v2

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate App Icons
        shell: pwsh
        run: |
          if (Test-Path "icons_launcher.yaml") {
            dart run icons_launcher:create
          }

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Package Windows Release (.zip)
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (Test-Path $releaseDir) {
            New-Item -ItemType Directory -Force -Path "build\dist"
            Compress-Archive -Path "$releaseDir\*" -DestinationPath "build\dist\windows-app.zip" -Force
            Write-Host "Successfully packaged build\dist\windows-app.zip"
          } else {
            Write-Error "Release directory not found: $releaseDir"
            exit 1
          }

      - name: Get Build Info
        id: info
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          if ("${env:GITHUB_REF_TYPE}" -ne "branch") {
            $tag = "build-${env:GITHUB_RUN_ID}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "tag: $tag"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/dist/windows-app.zip
          retention-days: 14

      - name: Create GitHub Release with Windows App
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/build-') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: release-${{ steps.info.outputs.tag }}-${{ github.run_number }}
          name: Release ${{ steps.info.outputs.tag }} (Build #${{ github.run_number }})
          body: |
            Automated Windows desktop build generated by SWAB Cloud Builder.
            - Commit: ${{ github.sha }}
            - Workflow Run: ${{ github.run_id }}
          files: |
            build/dist/windows-app.zip
